name: Publish Gem
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
        type: string

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  push:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      # Set up
      - uses: actions/checkout@v3
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: ruby

      - name: Update version and changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "s/\".*\"/\"$VERSION\"/" lib/acts_as_tenant/version.rb

          # Promote the Unreleased entries to this version and start a fresh Unreleased section
          grep -q '^Unreleased$' CHANGELOG.md || { echo "No 'Unreleased' heading in CHANGELOG.md"; exit 1; }
          ruby -i -0777 -pe '$_.sub!(/\AUnreleased\n-+\n/, "Unreleased\n----------\n\n#{ENV["VERSION"]}\n#{"-" * ENV["VERSION"].length}\n")' CHANGELOG.md

          bundle config set --local deployment 'false'
          bundle
          # Only bump our own version in the Appraisal lockfiles. Re-resolving them on the latest Ruby
          # upgrades gems past what the older Rubies in the CI matrix support.
          sed -i -E "s/^    acts_as_tenant \(.*\)$/    acts_as_tenant ($VERSION)/" gemfiles/*.gemfile.lock
          git config user.name 'GitHub Actions'
          git config user.email github-actions@github.com
          git add CHANGELOG.md gemfiles lib/acts_as_tenant/version.rb
          git commit -m "Version bump"
          git push

      # Release
      - uses: rubygems/release-gem@v1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes
